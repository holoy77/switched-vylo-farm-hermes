name: farm

"on":
  workflow_dispatch:
    inputs:
      count:
        description: "运行轮数 / 任务计数"
        required: false
        default: "25"
      proxy:
        description: "可选: 单次指定的代理节点链接 (支持 hysteria2 / socks5 / vless)"
        required: false
        default: ""
  schedule:
    - cron: "0 4,16 * * *"

jobs:
  farm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install playwright
        run: |
          python -m playwright install --with-deps chromium

      # 启动 sing-box 本地流量转发核心
      - name: Setup & Start sing-box relay
        env:
          PROXY_URL: ${{ inputs.proxy || secrets.PROXY_URL || secrets.SECRET_PROXY || secrets.JP_SOCKS_URL || secrets.HOME_VLESS_URL }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "未检测到代理 Secret，跳过 sing-box 启动。"
            exit 0
          fi

          echo "正在下载 sing-box 官方二进制文件..."
          TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          VERSION=${TAG#v}
          curl -fsSL -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz --strip-components=1
          sudo mv sing-box /usr/local/bin/
          sing-box version

          echo "生成 sing-box 本地转发布局..."
          python3 scripts/make_relay.py "$PROXY_URL"

          if [ -f "sing-box-config.json" ]; then
            echo "启动 sing-box 守护进程..."
            nohup sing-box run -c sing-box-config.json > sing-box.log 2>&1 &
            sleep 2

            # 校验本地 10900 端口存活
            if nc -z 127.0.0.1 10900; then
              echo "sing-box 启动成功，本地转发端口 127.0.0.1:10900 已就绪。"
            else
              echo "sing-box 启动失败，日志输出如下:"
              cat sing-box.log
              exit 1
            fi
          fi

      - name: Farm
        env:
          NOPROFIT_COOKIES: ${{ secrets.NOPROFIT_COOKIES || secrets.SWITCHED_COOKIES }}
          SWITCHED_COOKIES: ${{ secrets.SWITCHED_COOKIES || secrets.NOPROFIT_COOKIES }}
          COUNT: ${{ inputs.count || '25' }}
        run: |
          set -o pipefail
          # 检查本地是否有 sing-box 转发监听
          if nc -z 127.0.0.1 10900 2>/dev/null; then
            export SW_PROXY="socks5://127.0.0.1:10900"
            echo "已接入本地 sing-box 转发通道: $SW_PROXY"
          else
            echo "未启动代理中继，使用直连模式。"
          fi

          xvfb-run -a -s "-screen 0 1400x1000x24" python3 -u vylo_farm.py --count "$COUNT" 2>&1 | tee farm.log
          grep SUMMARY farm.log || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            *.log
            *.png
          retention-days: 2
